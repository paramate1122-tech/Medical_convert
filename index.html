<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--ln:#e5e5ea;--ac:#0071e3;--fill:#f2f2f7}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#2c2c2e;--ac:#2997ff;--fill:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif}
main{max-width:720px;margin:0 auto;padding:64px 20px 80px}
h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 auto 40px;max-width:480px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:24px;margin-bottom:20px}
#drop{text-align:center;padding:48px 24px;cursor:pointer;transition:background .2s}
#drop:hover,#drop.over{background:var(--fill)}
#drop b{display:block;font-size:19px;font-weight:600;margin-bottom:4px}
#drop span{color:var(--mu);font-size:14px}
#prev{max-width:100%;border-radius:10px;margin-top:20px;display:none}
#bar{height:3px;background:var(--fill);border-radius:2px;margin-top:20px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#st{margin-top:12px;font-size:14px;color:var(--mu);text-align:center;min-height:21px}
#res{display:none}
.f{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.f label{width:150px;color:var(--mu);font-size:14px;flex:none}
input{font:inherit;color:var(--tx);background:transparent;border:0;outline:0;width:100%;padding:4px 0;border-radius:6px}
input:focus{box-shadow:0 2px 0 var(--ac)}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;font-weight:400;text-align:left;color:var(--mu);padding:12px 8px 8px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--ln)}td.n{width:48px;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:0 6px}.x:hover{color:#ff3b30}
.acts{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:8px 0}
.pill{background:var(--ac);color:#fff;border:0;font:inherit;font-weight:600;padding:12px 24px;border-radius:980px;cursor:pointer}
.pill:hover{opacity:.88}
.hint{color:var(--mu);font-size:13px;margin:0 0 4px}
</style>
</head>
<body>
<main>
<h1>ภาพรายการตรวจ → Word</h1>
<p class="sub">อัปโหลดภาพตารางรายการตรวจ แล้วรับรายงานการตรวจรังสีวินิจฉัยเป็นไฟล์ Word ประมวลผลในเบราว์เซอร์ ภาพไม่ถูกส่งไปที่ใด</p>

<div class="card">
  <div id="drop"><b>เลือกภาพ</b><span>คลิก ลากไฟล์มาวาง หรือกด Ctrl+V</span></div>
  <input id="file" type="file" accept="image/*" hidden>
  <img id="prev" alt="">
  <div id="bar"><i></i></div>
  <div id="st"></div>
</div>

<div class="card" id="res">
  <p class="hint">ตรวจสอบข้อมูลก่อนดาวน์โหลด การอ่านภาพอาจคลาดเคลื่อนได้</p>
  <div class="f"><label for="name">ชื่อ-นามสกุลผู้ป่วย</label><input id="name"></div>
  <div class="f"><label for="hn">HN</label><input id="hn"></div>
  <div class="tw"><table>
    <thead><tr><th>ลำดับ</th><th>วันที่ตรวจ</th><th>รายการตรวจ (Examination)</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="acts">
    <button class="lk" id="add">เพิ่มแถว</button>
    <button class="pill" id="dl">ดาวน์โหลด Word</button>
  </div>
</div>
</main>

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const isThai=s=>/[\u0E00-\u0E7F]/.test(s);
const RPR=(sz,thai)=>`<w:rPr><w:rFonts w:hint="default" w:ascii="Angsana New" w:hAnsi="Angsana New" w:cs="Angsana New"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>${thai?'<w:cs/>':'<w:cs w:val="0"/>'}<w:lang w:val="en-US" w:bidi="th-TH"/></w:rPr>`;
const run=(t,sz=32)=>t===''?'':`<w:r>${RPR(sz,isThai(t))}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const TAB=`<w:r>${RPR(32,false)}<w:tab/></w:r>`;

function fillXml(xml,d){
  // ชื่อ-นามสกุล + HN
  xml=xml.replace(/<w:p w14:paraId="31FEBB50">[\s\S]*?<\/w:p>/,p=>{
    const runs=p.match(/<w:r>[\s\S]*?<\/w:r>/g);
    const head=p.slice(0,p.indexOf('<w:r>')).replace('<w:pPr>','<w:pPr><w:tabs><w:tab w:val="left" w:pos="6480"/></w:tabs>');
    return head+runs.slice(0,5).join('')+run(d.name)+TAB+run('HN: ')+run(d.hn)+'</w:p>';
  });
  // จัดตาราง: ความกว้างคอลัมน์, ระยะขอบเซลล์ และจัดข้อความกึ่งกลาง (ตามไฟล์ต้นแบบที่ปรับแล้ว)
  xml=xml.replace(/<w:tbl>[\s\S]*<\/w:tbl>/,t=>t
    .replace('<w:gridCol w:w="3808"/><w:gridCol w:w="2826"/>','<w:gridCol w:w="2720"/><w:gridCol w:w="3914"/>')
    .replace(/<w:tcW w:w="3808"/g,'<w:tcW w:w="2720"').replace(/<w:tcW w:w="2826"/g,'<w:tcW w:w="3914"')
    .replace(/<w:tblCellMar><w:left w:w="108" w:type="dxa"\/><w:right w:w="108" w:type="dxa"\/><\/w:tblCellMar>/g,
      '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar>')
    .replace(/<w:pPr><w:jc w:val="both"\/>/g,'<w:pPr><w:widowControl w:val="0"/><w:jc w:val="center"/>')
    .replace(/<w:pPr><w:jc w:val="center"\/>/g,'<w:pPr><w:widowControl w:val="0"/><w:jc w:val="center"/>'));
  // เพิ่มแถวถ้ารายการเกินแบบฟอร์ม (10 แถว)
  const rowRe=/<w:tr[ >][\s\S]*?<\/w:tr>/g;
  const rows=xml.match(rowRe), need=d.rows.length-(rows.length-1);
  if(need>0){
    const last=rows[rows.length-1];
    const blank=last.replace(/ w14:paraId="[^"]*"/g,'').replace(/<w:bookmarkStart[^>]*\/><w:bookmarkEnd[^>]*\/>/,'');
    xml=xml.replace(last,()=>last+blank.repeat(need));
  }
  // ใส่ข้อมูลตามแถว
  let i=0;
  return xml.replace(rowRe,tr=>{
    if(i++===0) return tr;
    const r=d.rows[i-2]; if(!r) return tr;
    const vals=[String(i-1),r.date,r.exam]; let c=0;
    return tr.replace(/<w:tc>[\s\S]*?<\/w:tc>/g,tc=>{
      const v=vals[c++], k=tc.lastIndexOf('</w:p>');
      const sz=(tc.match(/<w:sz w:val="(\d+)"/)||[])[1]||32;
      return tc.slice(0,k)+run(v,sz)+tc.slice(k);
    });
  });
}

async function buildDocx(JSZip,b64,d){
  const zip=await JSZip.loadAsync(b64,{base64:true});
  const xml=await zip.file('word/document.xml').async('string');
  zip.file('word/document.xml',fillXml(xml,d));
  return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ---------- อ่านตารางจากผล OCR (ใช้พิกัดคำ แบ่งคอลัมน์ตามช่องว่างกว้าง) ----------
const MODS=['ct','mri','us','cxr','mam','ot'];
const DATE=/(\d{4})\s*[\/\-.]\s*(\d{2})\s*[\/\-.]\s*(\d{2})\s+(\d{2})\s*[:.]\s*(\d{2})\s*[:.]\s*(\d{2})/;
const normThai=s=>s.replace(/\u0E4D\u0E32/g,'\u0E33').replace(/\s+/g,' ').trim();
const mode=a=>{const m={};a.filter(Boolean).forEach(x=>m[x]=(m[x]||0)+1);return Object.keys(m).sort((p,q)=>m[q]-m[p])[0]||''};
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]}
function fixMod(t){
  t=t.toLowerCase().replace(/[^a-z]/g,''); if(!t||MODS.includes(t)) return t;
  const c=MODS.filter(m=>lev(m,t)<=1); return c.length===1?c[0]:t;
}
function groups(line){
  const ws=(line.words||[]).filter(w=>w.text.trim()).sort((a,b)=>a.bbox.x0-b.bbox.x0); if(!ws.length) return [];
  const hs=ws.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b), th=hs[hs.length>>1]*2.5, g=[[ws[0]]];
  for(let i=1;i<ws.length;i++) (ws[i].bbox.x0-ws[i-1].bbox.x1>th?g.push([ws[i]]):g[g.length-1].push(ws[i]));
  return g.map(a=>a.map(w=>w.text).join(' ').trim());
}
// engLines: ผล OCR ภาษาอังกฤษ (HN, รายการตรวจ, ส่วนที่ตรวจ, วันที่)  thaLines: ผล OCR ภาษาไทย (ชื่อ)
function lineGroups(line, width){
  const ws=(line.words||[]).filter(w=>w.text && w.text.trim()).sort((a,b)=>a.bbox.x0-b.bbox.x0);
  if(!ws.length) return {cols:['','','',''], y:(line.bbox?.y0||0)};
  const cols=['','','',''], bounds=[0.16,0.43,0.775];
  for(const w of ws){
    const x=((w.bbox.x0+w.bbox.x1)/2)/(width||1);
    const idx=x<bounds[0]?0:x<bounds[1]?1:x<bounds[2]?2:3;
    cols[idx]+=(cols[idx]?' ':'')+w.text.trim();
  }
  return {cols,y:((line.bbox?.y0||0)+(line.bbox?.y1||line.bbox?.y0||0))/2};
}
function parseTable(engLines,thaLines,width){
  const rows=[],hns=[],names=[];
  const eng=engLines.map(l=>({...lineGroups(l,width),raw:l})).filter(x=>x.cols.some(Boolean));
  const tha=(thaLines||[]).map(l=>({...lineGroups(l,width),raw:l})).filter(x=>x.cols.some(Boolean));
  for(const e of eng){
    const [hn,nameUnused,exam,date]=e.cols,dm=(date||'').match(DATE);
    const hnClean=(hn.match(/\d{6,}/)||[''])[0];
    if(!hnClean || !dm) continue;
    hns.push(hnClean);
    // English names are read from column 2 in the English OCR pass.
    if(/^[A-Za-z][A-Za-z .,'-]{2,}$/.test((nameUnused||'').trim()) &&
       !/^(name|patient|date|examination)$/i.test((nameUnused||'').trim())){
      names.push((nameUnused||'').trim());
    }
    rows.push({y:e.y,date:`${dm[1]}/${dm[2]}/${dm[3]} ${dm[4]}:${dm[5]}:${dm[6]}`,exam:(exam||'').trim()});
  }
  for(const r of rows){
    const candidate=tha.filter(t=>t.cols[1]&&Math.abs(t.y-r.y)<Math.max(35,width*0.03))
      .sort((a,b)=>Math.abs(a.y-r.y)-Math.abs(b.y-r.y))[0];
    if(candidate) names.push(normThai(candidate.cols[1]));
  }
  return {hn:mode(hns),name:mode(names),rows:rows.map(({y,...r})=>r)};
}


const $=id=>document.getElementById(id);
const st=(t,p)=>{$('st').textContent=t;if(p!=null){$('bar').style.display='block';$('bar').firstChild.style.width=p+'%'}};
const num=()=>[...$('rows').children].forEach((tr,i)=>tr.querySelector('.n').textContent=i+1);

function addRow(r={}){
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="n"></td>'+['date','exam'].map(k=>`<td><input data-k="${k}"></td>`).join('')+'<td><button class="x" title="ลบแถว">×</button></td>';
  tr.querySelectorAll('input').forEach(i=>i.value=r[i.dataset.k]||'');
  tr.querySelector('.x').onclick=()=>{tr.remove();num()};
  $('rows').appendChild(tr);num();
}

// ขยายภาพ + แปลงเป็นขาว-ดำ (Otsu) ให้ OCR อ่านแม่นขึ้น
function prep(bmp){
  const s=Math.min(4,Math.max(1,3600/bmp.width)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),d=im.data;
  // Normalize colored table-cell backgrounds, including dark-blue rows.
  for(let i=0;i<d.length;i+=4){
    const r=d[i],gg=d[i+1],b=d[i+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);
    const sat=mx?((mx-mn)/mx):0, y=r*.299+gg*.587+b*.114;
    const blueFill=sat>0.12 && b>r*1.08 && b>gg*1.02 && y<235;
    const v=blueFill?255:y;
    d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
  }
  g.putImageData(im,0,0);return c;
}


async function ocr(lang,img,label,base){
  const w=await Tesseract.createWorker(lang,1,{logger:m=>{
    if(m.status==='recognizing text')st(label+' '+Math.round(m.progress*100)+'%',base+m.progress*45);
    else st('กำลังโหลดข้อมูลภาษา…',base)}});
  await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  const {data}=await w.recognize(img);await w.terminate();return data.lines;
}

async function handle(file){
  if(!file||!file.type.startsWith('image/'))return;
  $('prev').src=URL.createObjectURL(file);$('prev').style.display='block';$('res').style.display='none';
  try{
    st('กำลังเตรียมภาพ…',2);
    const img=prep(await createImageBitmap(file));
    const eng=await ocr('eng',img,'กำลังอ่านข้อมูลตาราง',5);
    const tha=await ocr('tha',img,'กำลังอ่านชื่อ',50);
    const d=parseTable(eng,tha,img.width);
    $('hn').value=d.hn;$('name').value=d.name;$('rows').innerHTML='';
    d.rows.forEach(addRow);if(!d.rows.length)addRow();
    $('res').style.display='block';st(d.rows.length?`อ่านได้ ${d.rows.length} รายการ`:'อ่านข้อมูลไม่ได้ ลองใช้ภาพที่ชัดขึ้น หรือกรอกเอง',100);
    $('res').scrollIntoView({behavior:'smooth'});
  }catch(e){st('เกิดข้อผิดพลาด: '+e.message)}
}

const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>handle(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files[0])};
document.onpaste=e=>handle([...e.clipboardData.files][0]);
$('add').onclick=()=>addRow();

$('dl').onclick=async()=>{
  const rows=[...$('rows').children].map(tr=>{const o={};tr.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value.trim());return o});
  const blob=await buildDocx(JSZip,TEMPLATE_B64,{hn:$('hn').value.trim(),name:$('name').value.trim(),rows});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`Result_${$('hn').value.trim()||'doc'}.docx`;a.click();
};
