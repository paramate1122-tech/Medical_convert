<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--ln:#e5e5ea;--ac:#0071e3;--fill:#f2f2f7}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#2c2c2e;--ac:#2997ff;--fill:#2c2c2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;
 font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif}
main{max-width:720px;margin:0 auto;padding:64px 20px 80px}
h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0 auto 40px;max-width:480px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:24px;margin-bottom:20px}
#drop{text-align:center;padding:48px 24px;cursor:pointer;transition:background .2s}
#drop:hover,#drop.over{background:var(--fill)}
#drop b{display:block;font-size:19px;font-weight:600;margin-bottom:4px}
#drop span{color:var(--mu);font-size:14px}
#prev{max-width:100%;border-radius:10px;margin-top:20px;display:none}
#bar{height:3px;background:var(--fill);border-radius:2px;margin-top:20px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#st{margin-top:12px;font-size:14px;color:var(--mu);text-align:center;min-height:21px}
#res{display:none}
.f{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.f label{width:150px;color:var(--mu);font-size:14px;flex:none}
input{font:inherit;color:var(--tx);background:transparent;border:0;outline:0;width:100%;padding:4px 0;border-radius:6px}
input:focus{box-shadow:0 2px 0 var(--ac)}
.tw{overflow-x:auto;margin-top:8px}table{border-collapse:collapse;width:100%;min-width:480px}
th{font-size:12px;font-weight:400;text-align:left;color:var(--mu);padding:12px 8px 8px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--ln)}td.n{width:48px;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:0 6px}.x:hover{color:#ff3b30}
.acts{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:8px 0}
.pill{background:var(--ac);color:#fff;border:0;font:inherit;font-weight:600;padding:12px 24px;border-radius:980px;cursor:pointer}
.pill:hover{opacity:.88}
.hint{color:var(--mu);font-size:13px;margin:0 0 4px}
</style>
</head>
<body>
<main>
<h1>ภาพรายการตรวจ → Word</h1>
<p class="sub">อัปโหลดภาพตารางรายการตรวจ แล้วรับรายงานการตรวจรังสีวินิจฉัยเป็นไฟล์ Word ประมวลผลในเบราว์เซอร์ ภาพไม่ถูกส่งไปที่ใด</p>

<div class="card">
  <div id="drop"><b>เลือกภาพ</b><span>คลิก ลากไฟล์มาวาง หรือกด Ctrl+V</span></div>
  <input id="file" type="file" accept="image/*" hidden>
  <img id="prev" alt="">
  <div id="bar"><i></i></div>
  <div id="st"></div>
</div>

<div class="card" id="res">
  <p class="hint">ตรวจสอบข้อมูลก่อนดาวน์โหลด การอ่านภาพอาจคลาดเคลื่อนได้</p>
  <div class="f"><label for="name">ชื่อ-นามสกุลผู้ป่วย</label><input id="name"></div>
  <div class="f"><label for="hn">HN</label><input id="hn"></div>
  <div class="tw"><table>
    <thead><tr><th>ลำดับ</th><th>วันที่ตรวจ</th><th>รายการตรวจ</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="acts">
    <button class="lk" id="add">เพิ่มแถว</button>
    <button class="pill" id="dl">ดาวน์โหลด Word</button>
  </div>
</div>
</main>

const RPR=(sz,thai)=>`<w:rPr><w:rFonts w:hint="default" w:ascii="Angsana New" w:hAnsi="Angsana New" w:cs="Angsana New"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>${thai?'<w:cs/>':'<w:cs w:val="0"/>'}<w:lang w:val="en-US" w:bidi="th-TH"/></w:rPr>`;
const run=(t,sz=32)=>t===''?'':`<w:r>${RPR(sz,isThai(t))}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const TAB=`<w:r>${RPR(32,false)}<w:tab/></w:r>`;

function fillXml(xml,d){
  // ชื่อ-นามสกุล + HN
  xml=xml.replace(/<w:p w14:paraId="31FEBB50">[\s\S]*?<\/w:p>/,p=>{
    const runs=p.match(/<w:r>[\s\S]*?<\/w:r>/g);
    const head=p.slice(0,p.indexOf('<w:r>')).replace('<w:pPr>','<w:pPr><w:tabs><w:tab w:val="left" w:pos="6480"/></w:tabs>');
    return head+runs.slice(0,5).join('')+run(d.name)+TAB+run('HN: ')+run(d.hn)+'</w:p>';
  });
  // เพิ่มแถวถ้ารายการเกินแบบฟอร์ม (15 แถว)
  const rowRe=/<w:tr[ >][\s\S]*?<\/w:tr>/g;
  const rows=xml.match(rowRe), need=d.rows.length-(rows.length-1);
  if(need>0){
    const last=rows[rows.length-1];
    const blank=last.replace(/ w14:paraId="[^"]*"/g,'').replace(/<w:bookmarkStart[^>]*\/><w:bookmarkEnd[^>]*\/>/,'');
    xml=xml.replace(last,()=>last+blank.repeat(need));
  }
  // ใส่ข้อมูลตามแถว
  let i=0;
  return xml.replace(rowRe,tr=>{
    if(i++===0) return tr;
    const r=d.rows[i-2]; if(!r) return tr;
    const vals=[String(i-1),r.date,r.exam]; let c=0; // ลำดับ | วันที่ตรวจ | รายการตรวจ
    return tr.replace(/<w:tc>[\s\S]*?<\/w:tc>/g,tc=>{
      const v=vals[c++], k=tc.lastIndexOf('</w:p>');
      const sz=(tc.match(/<w:sz w:val="(\d+)"/)||[])[1]||32;
      return tc.slice(0,k)+run(v,sz)+tc.slice(k);
    });
  });
}

async function buildDocx(JSZip,b64,d){
  const zip=await JSZip.loadAsync(b64,{base64:true});
  const xml=await zip.file('word/document.xml').async('string');
  zip.file('word/document.xml',fillXml(xml,d));
  return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ---------- อ่านตารางจากผล OCR (ใช้พิกัดคำ แบ่งคอลัมน์ตามช่องว่างกว้าง) ----------
// รูปแบบภาพตาราง: คอลัม1=HN, คอลัม2=ชื่อ-นามสกุล (ไทยหรืออังกฤษ), คอลัม3=รายการตรวจ, คอลัม4=วันที่ตรวจ
// ฟอร์ม Word: ลำดับ (นับเอง) | วันที่ตรวจ | รายการตรวจ, ชื่อ-นามสกุล และ HN อยู่บรรทัดหัวเอกสาร
const DATE=/(\d{4})\s*[\/\-.]\s*(\d{2})\s*[\/\-.]\s*(\d{2})\s+(\d{2})\s*[:.]\s*(\d{2})\s*[:.]\s*(\d{2})/;
const normThai=s=>s.replace(/\u0E4D\u0E32/g,'\u0E33').replace(/\s+/g,' ').trim();
const mode=a=>{const m={};a.filter(Boolean).forEach(x=>m[x]=(m[x]||0)+1);return Object.keys(m).sort((p,q)=>m[q]-m[p])[0]||''};
const med=a=>{const b=[...a].sort((p,q)=>p-q);return b.length?b[b.length>>1]:0};
// แก้คำนำหน้าชื่อที่ OCR มักอ่านจุดเพี้ยน เช่น "นสี," "น,ส." → "น.ส."
const TITLES=[[/^น\s*[.,]*\s*ส[ีิ]?\s*[.,]*\s*/,'น.ส. '],[/^ด\s*[.,]+\s*ช\s*[.,]*\s*/,'ด.ช. '],[/^ด\s*[.,]+\s*ญ\s*[.,]*\s*/,'ด.ญ. ']];
function cleanThaiName(t){
  t=normThai(t).replace(/[^฀-๿. ]/g,' ').replace(/\s+/g,' ').trim();
  for(const [re,v] of TITLES) if(re.test(t)){t=t.replace(re,v);break}
  // ตัดเศษอักษรท้ายชื่อที่ไม่ใช่คำ (เช่น ขอบเซลล์ที่ถูกอ่านเป็นตัวอักษร)
  return t.split(' ').filter((w,i)=>i<3||w.length>1).join(' ').trim();
}
// วิเคราะห์โครงตาราง จากผล OCR ภาษาอังกฤษ (ใช้พิกัดคำ)
// - HN = คำแรกที่เป็นตัวเลข 6 หลักขึ้นไป, วันที่ = คำท้ายแถวที่ตรงรูปแบบวันเวลา
// - คำที่อยู่ระหว่าง HN กับวันที่ แบ่งเป็น "ชื่อ" กับ "รายการตรวจ" ด้วยตำแหน่งขอบซ้ายของคอลัมน์รายการตรวจ
//   ซึ่งหาจากทุกแถวรวมกัน ไม่ตัดสินจากช่องว่างของแถวเดียว (รายการตรวจหรือชื่อที่ยาวจะชิดคอลัมน์ข้างเคียงจนแยกไม่ออก)
function layout(engLines){
  const rows=[];
  for(const l of engLines){
    const ws=(l.words||[]).filter(w=>w.text.trim()).sort((a,b)=>a.bbox.x0-b.bbox.x0);
    if(!ws.length) continue;
    let dI=ws.length,dm=null;
    for(let i=ws.length-1;i>=0;i--){const m=ws.slice(i).map(w=>w.text).join(' ').match(DATE);if(m){dI=i;dm=m;break}}
    const hI=ws.findIndex((w,i)=>i<dI&&/\d{6,}/.test(w.text));
    if(!dm&&hI<0) continue; // ไม่ใช่แถวข้อมูล (เช่น หัวตาราง)
    const h=med(ws.map(w=>w.bbox.y1-w.bbox.y0));
    rows.push({ws,h,hn:hI<0?'':ws[hI].text.match(/\d{6,}/)[0],hnX1:hI<0?null:ws[hI].bbox.x1,
      date:dm?`${dm[1]}/${dm[2]}/${dm[3]} ${dm[4]}:${dm[5]}:${dm[6]}`:'',
      dateX0:dI<ws.length?ws[dI].bbox.x0:null,mid:ws.slice(hI+1,dI)});
  }
  const h=med(rows.map(r=>r.h))||20;
  // รวมช่วงแกน x ที่มีคำอยู่ของทุกแถว แล้วหาแถบว่างที่กว้างที่สุด = รอยต่อคอลัมน์ชื่อกับรายการตรวจ
  // (ช่องว่างระหว่างคำในชื่อ/รายการตรวจจะแคบกว่า และรายการตรวจที่ต่างกันในแต่ละแถวจะถมช่องว่างของกันและกัน)
  const iv=rows.flatMap(r=>r.mid.map(w=>[w.bbox.x0,w.bbox.x1])).sort((a,b)=>a[0]-b[0]);
  let gap=0,examX=-Infinity,end=iv.length?iv[0][1]:0;
  for(const [a,b] of iv){if(a-end>gap){gap=a-end;examX=a};end=Math.max(end,b)}
  // ช่องว่างแคบมาก ถือว่าไม่มีคอลัมน์ชื่อ คำตรงกลางทั้งหมดเป็นรายการตรวจ
  if(gap<h*0.6) examX=-Infinity; else examX-=h*0.3;
  let nx0=Infinity,nx1=-Infinity,ny0=Infinity,ny1=-Infinity;
  for(const r of rows){
    r.exam=normThai(r.mid.filter(w=>w.bbox.x0>=examX).map(w=>w.text).join(' '));
    const nm=r.mid.filter(w=>w.bbox.x0<examX);
    const a=nm.length?Math.min(...nm.map(w=>w.bbox.x0)):r.hnX1, b=nm.length?Math.max(...nm.map(w=>w.bbox.x1)):examX;
    if(a!=null&&isFinite(a)) nx0=Math.min(nx0,a);
    if(b!=null&&isFinite(b)) nx1=Math.max(nx1,b);
    ny0=Math.min(ny0,...r.ws.map(w=>w.bbox.y0));ny1=Math.max(ny1,...r.ws.map(w=>w.bbox.y1));
  }
  const nameBox=isFinite(nx0)&&isFinite(nx1)&&nx1>nx0?{x0:nx0-h,x1:nx1+h,y0:ny0-h,y1:ny1+h}:null;
  return {rows,h,nameBox};
}
// ตัดเฉพาะคอลัมน์ชื่อจากภาพต้นฉบับ (ภาพเทาไม่แปลงขาว-ดำ) แล้วขยายให้ตัวอักษรใหญ่พอ สำหรับ OCR ภาษาไทย
// การใช้ภาพขาว-ดำเต็มแถว ทำให้สระ/วรรณยุกต์และจุดในคำนำหน้า (น.ส.) เพี้ยนบ่อย
function nameCrop(bmp,L,s){
  const b=L.nameBox; if(!b) return null;
  const x0=Math.max(0,b.x0/s),y0=Math.max(0,b.y0/s),x1=Math.min(bmp.width,b.x1/s),y1=Math.min(bmp.height,b.y1/s);
  if(x1-x0<4||y1-y0<4) return null;
  const k=Math.min(6,Math.max(2,55/(L.h/s))),c=document.createElement('canvas');
  c.width=Math.round((x1-x0)*k);c.height=Math.round((y1-y0)*k);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=d[i]*.299+d[i+1]*.587+d[i+2]*.114;d[i+3]=255}
  g.putImageData(im,0,0);return c;
}
// L: ผลจาก layout(), tha/eng: ผล OCR คอลัมน์ชื่อด้วยภาษาไทย/อังกฤษ ({lines,confidence})
function parseTable(L,tha,eng){
  // ชื่ออาจเป็นไทยหรืออังกฤษ: เลือกภาษาที่ OCR มั่นใจกว่า (ภาษาที่ผิดจะได้ค่าความมั่นใจต่ำชัดเจน
  // เช่น ชื่อไทย: tha≈90 eng≈30, ชื่ออังกฤษ: eng≈90 tha≈70) ไม่ใช้ความ "ซ้ำ" ของผลลัพธ์
  // เพราะ OCR ภาษาที่ผิดก็อ่านเพี้ยนแบบเดิมซ้ำทุกแถวได้
  // ชื่อคนเดียวกันซ้ำทุกแถว จึงใช้ค่าที่อ่านได้บ่อยที่สุด
  const thai=(tha&&tha.confidence||0)>=(eng&&eng.confidence||0);
  const name=thai
    ?mode(((tha&&tha.lines)||[]).map(l=>cleanThaiName(l.text||'')).filter(t=>/[\u0E00-\u0E7F]{2}/.test(t)))
    :mode(((eng&&eng.lines)||[]).map(l=>(l.text||'').replace(/[^A-Za-z .,'-]/g,' ').replace(/\s+/g,' ').trim()).filter(t=>/[A-Za-z]{2}/.test(t)));
  return {hn:mode(L.rows.map(r=>r.hn)),name,rows:L.rows.map(r=>({date:r.date,exam:r.exam}))};
}



const $=id=>document.getElementById(id);
const st=(t,p)=>{$('st').textContent=t;if(p!=null){$('bar').style.display='block';$('bar').firstChild.style.width=p+'%'}};
const num=()=>[...$('rows').children].forEach((tr,i)=>tr.querySelector('.n').textContent=i+1);

function addRow(r={}){
  const tr=document.createElement('tr');
  tr.innerHTML='<td class="n"></td>'+['date','exam'].map(k=>`<td><input data-k="${k}"></td>`).join('')+'<td><button class="x" title="ลบแถว">×</button></td>';
  tr.querySelectorAll('input').forEach(i=>i.value=r[i.dataset.k]||'');
  tr.querySelector('.x').onclick=()=>{tr.remove();num()};
  $('rows').appendChild(tr);num();
}

// ขยายภาพ + แปลงเป็นขาว-ดำแบบ adaptive local-mean (Bradley-Roth) ให้ OCR อ่านแม่นขึ้น
// หมายเหตุ: การใช้ threshold เดียวทั้งภาพ หรือแม้แต่แบ่งเป็นแถบแนวนอน (band) ก็ยังพลาดได้
// ถ้าพื้นสีเข้ม (เช่น สีฟ้าเข้ม) อยู่แค่บางเซลล์/บางคอลัมน์ เพราะค่าเฉลี่ยของทั้งแถบจะถูกดึงให้สว่างขึ้น
// จากพื้นที่ส่วนใหญ่ที่สว่างกว่า ทำให้เซลล์เข้มนั้นยังถูกปัดเป็นดำทั้งก้อนอยู่ดี
// จึงเปลี่ยนมาเทียบค่าความสว่างของแต่ละพิกเซลกับ "ค่าเฉลี่ยเฉพาะบริเวณใกล้เคียง" (local window)
// โดยใช้ integral image เพื่อคำนวณผลรวมในหน้าต่างแบบ O(1) ต่อพิกเซล วิธีนี้จะแยกตัวอักษรออกจากพื้นหลัง
// ได้ไม่ว่าพื้นหลังตรงนั้นจะเป็นสีอะไร/เข้มแค่ไหนก็ตาม ตราบใดที่ตัวอักษรกับพื้นรอบๆ ยังต่างกันพอมองเห็นได้
function prep(bmp){
  const s=Math.min(3,Math.max(1,3200/bmp.width)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),d=im.data,W=c.width,H=c.height;
  const lum=new Float64Array(W*H);
  for(let i=0,p=0;i<d.length;i+=4,p++) lum[p]=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
  // integral image (summed-area table) สำหรับหาผลรวมความสว่างในหน้าต่างใดๆ แบบเร็ว
  const intg=new Float64Array((W+1)*(H+1));
  for(let y=0;y<H;y++){
    let rowSum=0;
    for(let x=0;x<W;x++){
      rowSum+=lum[y*W+x];
      intg[(y+1)*(W+1)+(x+1)]=intg[y*(W+1)+(x+1)]+rowSum;
    }
  }
  const win=Math.max(15,Math.min(45,Math.round(Math.min(W,H)/25))),half=win>>1,T=0.85;
  for(let y=0;y<H;y++){
    const y0=Math.max(0,y-half),y1=Math.min(H-1,y+half);
    for(let x=0;x<W;x++){
      const x0=Math.max(0,x-half),x1=Math.min(W-1,x+half),area=(x1-x0+1)*(y1-y0+1);
      const sum=intg[(y1+1)*(W+1)+(x1+1)]-intg[y0*(W+1)+(x1+1)]-intg[(y1+1)*(W+1)+x0]+intg[y0*(W+1)+x0];
      const p=y*W+x,i=p*4,v=lum[p]>(sum/area)*T?255:0;
      d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
    }
  }
  g.putImageData(im,0,0);c.scale=s;return c;
}

async function ocr(lang,img,label,base,span=45){
  const w=await Tesseract.createWorker(lang,1,{logger:m=>{
    if(m.status==='recognizing text')st(label+' '+Math.round(m.progress*100)+'%',base+m.progress*span);
    else st('กำลังโหลดข้อมูลภาษา…',base)}});
  await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  const {data}=await w.recognize(img);await w.terminate();return data;
}

async function handle(file){
  if(!file||!file.type.startsWith('image/'))return;
  $('prev').src=URL.createObjectURL(file);$('prev').style.display='block';$('res').style.display='none';
  try{
    st('กำลังเตรียมภาพ…',2);
    const bmp=await createImageBitmap(file),img=prep(bmp);
    const L=layout((await ocr('eng',img,'กำลังอ่านข้อมูลตาราง',5,55)).lines);
    const crop=nameCrop(bmp,L,img.scale);
    const tha=crop?await ocr('tha',crop,'กำลังอ่านชื่อ',60,20):null;
    const eng=crop?await ocr('eng',crop,'กำลังอ่านชื่อ',80,18):null;
    const d=parseTable(L,tha,eng);
    $('hn').value=d.hn;$('name').value=d.name;$('rows').innerHTML='';
    d.rows.forEach(addRow);if(!d.rows.length)addRow();
    $('res').style.display='block';st(d.rows.length?`อ่านได้ ${d.rows.length} รายการ`:'อ่านข้อมูลไม่ได้ ลองใช้ภาพที่ชัดขึ้น หรือกรอกเอง',100);
    $('res').scrollIntoView({behavior:'smooth'});
  }catch(e){st('เกิดข้อผิดพลาด: '+e.message)}
}

const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>handle(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files[0])};
document.onpaste=e=>handle([...e.clipboardData.files][0]);
$('add').onclick=()=>addRow();

$('dl').onclick=async()=>{
  const rows=[...$('rows').children].map(tr=>{const o={};tr.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value.trim());return o});
  const blob=await buildDocx(JSZip,TEMPLATE_B64,{hn:$('hn').value.trim(),name:$('name').value.trim(),rows});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`Result_${$('hn').value.trim()||'doc'}.docx`;a.click();
};
